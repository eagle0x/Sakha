<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>विमर्श के विषय | शाखा पुस्तिका</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- NAVBAR -->

<header class="navbar">

    <button id="menuBtn" class="menu-btn">
        ☰
    </button>

    <div class="logo">

        <span class="logo-emoji">
            🚩
        </span>

        <div class="logo-text">

            <div class="logo-main" data-key="logo">
                e-शाखा पुस्तिका
            </div>

            <div class="logo-sub" data-key="rss">
                राष्ट्रीय स्वयंसेवक संघ, हरियाणा
            </div>

        </div>

    </div>

    <nav class="nav-links" id="navLinks">

        <a href="index.html" data-key="home">
            मुख्य पृष्ठ
        </a>

        <a href="vimarsh.html" class="active" data-key="vimarsh">
            विमर्श
        </a>

        <a href="activities.html" data-key="activities">
            गतिविधियां
        </a>

        <a href="current-affairs.html" data-key="news">
            समाचार
        </a>

        <a href="jiwani.html" data-key="biography">
            जीवनी
        </a>

        <a href="panch-parivartan.html" data-key="panch">
            पंच परिवर्तन
        </a>

    </nav>

    <button id="themeBtn">
        🌙
    </button>

</header>


<!-- PAGE -->

<section class="section">

    <div class="section-title">

        <h2>
            विमर्श के विषय
        </h2>

    </div>

    <p style="
        color:var(--muted);
        margin-bottom:30px;
        line-height:1.8;
    ">

        शाखा में होने वाले वैचारिक विमर्श के प्रमुख विषय

    </p>

    <div id="topicsContainer"
         class="card-grid">

    </div>

</section>


<!-- MODAL -->

<div id="topicModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">
            ×
        </span>

        <div id="modalBody">

        </div>

    </div>

</div>


<script>

/* THEME */

if(localStorage.getItem("theme")==="dark"){

    document.body.classList.add("dark");

}

document.getElementById("themeBtn")
.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    localStorage.setItem(

        "theme",

        document.body.classList.contains("dark")
        ? "dark"
        : "light"

    );

});


/* MOBILE MENU */

document.getElementById("menuBtn")
.addEventListener("click",()=>{

    document.getElementById("navLinks")
    .classList.toggle("show");

});


/* MODAL */

const modal =
document.getElementById("topicModal");

const modalBody =
document.getElementById("modalBody");

const closeModal =
document.getElementById("closeModal");


closeModal.onclick = ()=>{

    modal.style.display = "none";

};


window.onclick = e=>{

    if(e.target===modal){

        modal.style.display = "none";

    }

};


/* LOAD CONTENT */

fetch("articles/vimarsh.json")

.then(res=>res.json())

.then(data=>{

    const container =
    document.getElementById(
        "topicsContainer"
    );

    data.forEach(topic=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.style.cursor = "pointer";

        card.innerHTML = `

            <div class="card-body">

                <h3>
                    ${topic.title}
                </h3>

                <p>
                    ${topic.description}
                </p>

            </div>

        `;


        card.addEventListener("click",()=>{

            modal.style.display = "block";

            modalBody.innerHTML = `

                <h2 style="
                    margin-bottom:15px;
                ">

                    ${topic.title}

                </h2>

                <p style="
                    color:var(--muted);
                    margin-bottom:25px;
                ">

                    ${topic.description}

                </p>

                <ul class="bio-list">

                    ${

                        topic.points

                        .map(point=>

                            `<li>${point}</li>`

                        )

                        .join("")

                    }

                </ul>

            `;

        });


        container.appendChild(card);

    });

})

.catch(err=>{

    console.error(err);

    document.getElementById(
        "topicsContainer"
    ).innerHTML = `

        <p style="
            color:var(--muted);
            text-align:center;
        ">

            विषय लोड नहीं हो सके।

        </p>

    `;

});

</script>
<button id="floatingLangBtn" class="floating-lang-btn">
    EN
</button>
<!-- <script src="script.js"></script> -->
<script src="lang.js"></script>

</body>
</html>

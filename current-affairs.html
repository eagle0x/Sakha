<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>वर्तमान मामले | शाखा पुस्तिका</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>

.current-container{
    max-width:1200px;
    margin:40px auto;
    padding:0 20px;
}

.page-title{
    margin-bottom:30px;
}

.page-title h1{
    font-size:2.5rem;
}

.page-title p{
    color:var(--muted);
}

.search-box{
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:14px 18px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:1rem;
}

.category-chips{

    display:flex;

    gap:10px;

    margin-bottom:30px;

    overflow-x:auto;

    scrollbar-width:none;

    -ms-overflow-style:none;

    padding-bottom:5px;

}

.category-chips::-webkit-scrollbar{

    display:none;

}

.category-chips button{

    flex-shrink:0;

    border:none;

    padding:10px 18px;

    border-radius:999px;

    cursor:pointer;

    background:var(--card);

    color:var(--text);

    border:1px solid var(--border);

    white-space:nowrap;

}

.category-chips button.active{

    background:var(--primary);

    color:white;

}


.category-chips .active{
    background:#ea580c;
    color:white;
}

.news-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill, minmax(320px, 320px));

    justify-content:center;

    gap:25px;

}

.news-card{

    width:320px;

    background:var(--card);

    border-radius:18px;

    overflow:hidden;

    box-shadow:var(--shadow);

    display:flex;

    flex-direction:column;

    height:100%;

    transition:.3s;

}

.news-card:hover{

    transform:translateY(-5px);

}

/* Image always on top */

.news-card img{

    width:100%;

    height:200px;

    object-fit:cover;

    display:block;

}

.news-content{

    padding:18px;

    display:flex;

    flex-direction:column;

    flex:1;

}

.news-date{

    color:var(--muted);

    font-size:.9rem;

    margin-bottom:10px;

}

.news-category{

    display:inline-block;

    background:#ea580c;

    color:white;

    padding:5px 12px;

    border-radius:999px;

    margin-bottom:12px;

    font-size:.85rem;

    width:fit-content;

}

.news-content h3{

    margin-bottom:12px;

    line-height:1.5;

}

.news-content p{

    color:var(--muted);

    line-height:1.7;

    flex:1;

}
.news-content{
    padding:18px;
}

.-date{
    color:var(--muted);
    font-size:.9rem;
    margin-bottom:10px;
}

.news-category{
    display:inline-block;
    background:#ea580c;
    color:white;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:12px;
    font-size:.85rem;
}

.news-content h3{
    margin-bottom:12px;
}

.news-content p{
    color:var(--muted);
}

.read-btn{
    margin-top:15px;
    border:none;
    background:#ea580c;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}
.nav-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.back-btn{
    display:none;
    text-decoration:none;
    color:inherit;
    font-size:1.5rem;
    font-weight:600;
    line-height:1;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:9999;
    padding:20px;
}

.modal.show{
    display:flex;
    justify-content:center;
    align-items:center;
}

.current-modal{
    background:var(--card);
    color:var(--text);
    width:95%;
    max-width:900px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px;
    padding:30px;
    position:relative;
}

.close-btn{
    position:absolute;
    right:25px;
    top:20px;
    font-size:2rem;
    cursor:pointer;
}

.modal-image{
    width:100%;
    max-height:450px;
    object-fit:contain;
    border-radius:16px;
    margin-bottom:25px;
}

.modal-date{
    color:var(--muted);
    margin:15px 0;
}

.modal-body{
    line-height:2;
}

.modal-actions{
    margin-top:30px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}
    
@media(max-width:768px){

    .back-btn{
        display:block;
    }

    .-grid{

        grid-template-columns:1fr;

    }

    .-card{

        width:100%;

    }

}

</style>

</head>
<body>

<header class="navbar">

    <button id="menuBtn" class="menu-btn">
        ☰
    </button>

    <div class="logo">
    <span class="logo-emoji">🚩</span>

        <div class="logo-text">

            <div class="logo-main" data-key="logo">
                e-शाखा पुस्तिका
            </div>

            <div class="logo-sub" data-key="rss">
                राष्ट्रीय स्वयंसेवक संघ, हरियाणा
            </div>

        </div>

    </div>

    <nav class="nav-links" id="navLinks">

        <a href="index.html" data-key="home">
            मुख्य पृष्ठ
        </a>

        <a href="vimarsh.html" data-key="discourse">
            विमर्श
        </a>

        <a href="activities.html" data-key="activities">
            गतिविधियां
        </a>

        <a href="current-affairs.html" class="active" data-key="">
            समाचार
        </a>

        <a href="jiwani.html" data-key="biography">
            जीवनी
        </a>

        <a href="panch-parivartan.html" data-key="panch">
            पंच परिवर्तन
        </a>

    </nav>

    <button id="themeBtn">
        🌙
    </button>

</header>

<div class="current-container">

    <div class="page-title">

        <h1 data-key="ca">📰 वर्तमान मामले</h1>

        <p data-key="txtca">
            इस सप्ताह की प्रमुख घटनाएँ एवं समसामयिक विषय
        </p>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="सामयिकी खोजें...">

    </div>

    <div class="category-chips">

        <button class="active" data-category="सभी" data-key="all">सभी</button>
        
        <button data-category="राष्ट्रीय" data-key="nat">राष्ट्रीय</button>
        
        <button data-category="अंतरराष्ट्रीय" data-key="inat">अंतरराष्ट्रीय</button>
        
        <button data-category="खेल" data-key="game">खेल</button>
        
        <button data-category="विज्ञान" data-key="sc">विज्ञान</button>
        
        <button data-category="अर्थव्यवस्था" data-key="eco">अर्थव्यवस्था</button>
        
        <button data-category="पर्यावरण" data-key="env">पर्यावरण</button>

    </div>

    <div
        class="news-grid"
        id="newsContainer">

    </div>

</div>
<!-- Current Affairs Modal -->

<div id="newsModal" class="modal">

    <div class="modal-content current-modal">

        <span id="closeModal" class="close-btn">
            ×
        </span>

        <div id="modalBody">

        </div>

    </div>

</div>

<script>



const container =
document.getElementById("newsContainer");

function render(data){

    container.innerHTML="";
    if(data.length===0){

    container.innerHTML = `

    <p style="
        text-align:center;
        color:var(--muted);
        grid-column:1/-1;
    ">

        😕 कोई परिणाम नहीं मिला।

    </p>

    `;

    return;

}
    data.sort(
        (a,b)=> b.id - a.id
    );

    data.forEach(item=>{

       container.innerHTML += `

<div class="news-card">

    <img src="${item.image}">

    <div class="news-content">

        <div class="news-date">
            📅 ${item.date}
        </div>

        <span class="news-category">
            ${item.category}
        </span>

        <h3>
            ${item.title}
        </h3>

        <p>
            ${item.description}
        </p>

        <button
            class="read-btn"
            onclick="openNews(${item.id})">

            और पढ़ें

        </button>

    </div>

</div>

`;

    });

}

let allNews = [];

async function loadNews(){

    try{

        const res =
        await fetch(
            "articles/current-affairs.json"
        );

        allNews =
        await res.json();

        render(allNews);

    }
    catch(err){

        console.error(err);

        container.innerHTML =

        "<p>सामयिकी लोड नहीं हो सकी।</p>";

    }

}

loadNews();
const searchInput =
document.getElementById("searchInput");

const categoryAliases = {

    "राष्ट्रीय":
    "national india government politics",

    "अंतरराष्ट्रीय":
    "international world global foreign",

    "खेल":
    "sports game cricket football olympics",

    "विज्ञान":
    "science technology research innovation",

    "अर्थव्यवस्था":
    "economy finance business market",

    "पर्यावरण":
    "environment climate ecology",

    "रक्षा":
    "defence military army navy airforce"

};

searchInput.addEventListener(
"input",
function(){

    const q =
    this.value.toLowerCase();

    const filtered =
    allNews.filter(item=>{

        const aliases =

            categoryAliases[
                item.category
            ] || "";

        return(

            item.title
            .toLowerCase()
            .includes(q)

            ||

            item.description
            .toLowerCase()
            .includes(q)

            ||

            item.category
            .toLowerCase()
            .includes(q)

            ||

            aliases
            .toLowerCase()
            .includes(q)

            ||

            (
                item.keywords || ""
            )
            .toLowerCase()
            .includes(q)

        );

    });

    render(filtered);

});
const chips =
document.querySelectorAll(
".category-chips button"
);

chips.forEach(chip=>{

    chip.addEventListener(
    "click",
    ()=>{

        chips.forEach(c=>
            c.classList.remove(
                "active"
            )
        );

        chip.classList.add(
            "active"
        );

        const category =
        chip.dataset.category;

        if(category==="सभी"){

            render(allNews);

            return;

        }

        render(

            allNews.filter(
                item=>

                item.category===category
            )

        );

    }

    );

});

function openNews(id){

    const article = allNews.find(
        item => item.id == id
    );

    if(!article) return;

    document.getElementById("modalBody").innerHTML = `

        <img
            src="${article.image}"
            class="modal-image">

        <span class="news-category">

            ${article.category}

        </span>

        <h2 style="margin-top:20px;">

            ${article.title}

        </h2>

        <div class="modal-date">

            📅 ${article.date}

        </div>

        <div class="modal-body">

            ${article.content}

        </div>

        <div class="modal-actions">

            <button
                class="read-btn"
                onclick="shareNews()">

                📤 शेयर

            </button>

            <button
                class="read-btn"
                onclick="window.print()">

                🖨️ PDF

            </button>

        </div>

    `;

    document
        .getElementById("newsModal")
        .classList.add("show");
}

function shareNews(){

    const text =
    document.querySelector("#modalBody h2")?.innerText || "";

    if(navigator.share){

        navigator.share({
            title:text,
            text:text
        });

    }
}

window.addEventListener("DOMContentLoaded",()=>{

    document.getElementById("closeModal")
    .addEventListener("click",()=>{

        document
        .getElementById("newsModal")
        .classList.remove("show");

    });

});

window.addEventListener("click",(e)=>{

    if(e.target.id==="newsModal"){

        document
        .getElementById("newsModal")
        .classList.remove("show");

    }

});
document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        document
        .getElementById("newsModal")
        .classList.remove("show");

    }

});
/* Theme */

const themeBtn =
document.getElementById("themeBtn");

if(localStorage.getItem("theme")==="dark"){

    document.body.classList.add("dark");

}

themeBtn.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    localStorage.setItem(

        "theme",

        document.body.classList.contains("dark")
        ? "dark"
        : "light"

    );

});

const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

if (menuBtn && navLinks) {

    menuBtn.addEventListener("click", () => {

        navLinks.classList.toggle("show");

    });

}
</script>
<button id="floatingLangBtn" class="floating-lang-btn">
    EN
</button>
<script src="lang.js"></script>
</body>
</html>

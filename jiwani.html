<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>जीवनी</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🚩 जीवनी
    </div>

    <nav class="nav-links">

        <a href="index.html">
            मुख्य पृष्ठ
        </a>

    </nav>

    <button id="themeBtn">
        🌙
    </button>

</header>


<section class="section">

    <div class="section-title">

        <h2>महापुरुषों की जीवनी</h2>

    </div>

    <div id="peopleContainer"
         class="card-grid">

    </div>

</section>


<script>

/* Theme */

if(localStorage.getItem("theme")==="dark"){

    document.body.classList.add("dark");

}

document.getElementById("themeBtn")
.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );

});


/* Load People */

fetch("biographies/people.json")

.then(res=>res.json())

.then(data=>{

    const container=
    document.getElementById(
    "peopleContainer"
    );

    data.forEach(person=>{

        container.innerHTML += `

        <a href="biography.html?id=${person.id}"
           class="card"
           style="
           text-decoration:none;
           color:inherit;">

            <img
            src="${person.image}"
            alt="${person.name}">

            <div class="card-body">

                <h3>
                    ${person.name}
                </h3>

                <p>
                    ${person.description}
                </p>

            </div>

        </a>

        `;

    });

});

</script>

</body>
</html>

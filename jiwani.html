<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>जीवनी</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<header class="navbar">

    <button id="menuBtn" class="menu-btn">
        ☰
    </button>

<div class="logo">
    <span class="logo-emoji">🚩</span>

    <div class="logo-text">
        <div class="logo-main">
            E-शाखा पुस्तिका
        </div>

        <div class="logo-sub">
            राष्ट्रीय स्वयंसेवक संघ, हरियाणा
        </div>
    </div>
</div>

    <nav class="nav-links" id="navLinks">

        <a href="index.html">मुख्य पृष्ठ</a>

        <a href="vimarsh.html">
            विमर्श के विषय
        </a>

        <a href="activities.html">
            गतिविधियां
        </a>

        <a href="current-affairs.html">
            वर्तमान मामले
        </a>

        <a href="jiwani.html" class="active">
            जीवनी
        </a>

        <a href="panch-parivartan.html">
            पंच परिवर्तन
        </a>

    </nav>

    <button id="themeBtn">
        🌙
    </button>

</header>


<section class="section">

    <div class="section-title">

        <h2>महापुरुषों की जीवनी</h2>

    </div>

    <div id="peopleContainer"
         class="card-grid">

    </div>

</section>


<script>

/* Theme */

if(localStorage.getItem("theme")==="dark"){

    document.body.classList.add("dark");

}

document.getElementById("themeBtn")
.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );

});


/* Load People */

fetch("biographies/people.json")

.then(res=>res.json())

.then(data=>{

    const container=
    document.getElementById(
    "peopleContainer"
    );

    data.forEach(person=>{

        container.innerHTML += `

        <a href="biography.html?id=${person.id}"
           class="card"
           style="
           text-decoration:none;
           color:inherit;">

            <img
            src="${person.image}"
            alt="${person.name}">

            <div class="card-body">

                <h3>
                    ${person.name}
                </h3>

                <p>
                    ${person.description}
                </p>

            </div>

        </a>

        `;

    });

});

</script>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>पंच परिवर्तन | शाखा पुस्तिका</title>

<link rel="icon" type="image/png" href="images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>

.panch-container{
    max-width:1200px;
    margin:50px auto;
    padding:0 20px;
}

.page-header{
    text-align:center;
    margin-bottom:50px;
}

.page-header h1{
    font-size:2.7rem;
    color:var(--primary);
    margin-bottom:15px;
}

.page-header p{
    color:var(--muted);
    font-size:1.1rem;
}

.panch-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.panch-card{
    background:var(--card);
    border-radius:20px;
    padding:28px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    transition:.3s;
}

.panch-top{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.panch-number{
    width:42px;
    height:42px;

    border-radius:50%;

    background:var(--primary);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:700;
    font-size:1.2rem;
}

.panch-title{
    color:var(--primary);
    font-size:1.2rem;
    font-weight:700;
}

.panch-card p{
    line-height:1.9;
    color:var(--text);
}

.importance-box{
    margin-top:50px;

    background:#f8f3e6;

    border-radius:20px;

    padding:50px 35px;

    text-align:center;

    border:1px solid #eadfc2;
}

body.dark .importance-box{
    background:#243040;
    border-color:var(--border);
}

.importance-box h2{
    color:var(--primary);
    margin-bottom:30px;
}

.importance-box p{
    line-height:2.1;
    font-size:1.05rem;
}

.vande{
    text-align:center;
    margin:50px 0 40px;
}

.vande h1{
    font-size:4rem;
    color:var(--primary);
}
.intro-box{
    margin-bottom:40px;
}

.intro-box p{
    text-align:justify;
    line-height:2;
    margin-bottom:15px;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:9999;
    padding:20px;
}

.modal.show{
    display:flex;
    justify-content:center;
    align-items:center;
}

.current-modal{
    background:var(--card);
    color:var(--text);
    width:95%;
    max-width:1000px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px;
    padding:30px;
    position:relative;
}

.close-btn{
    position:absolute;
    right:25px;
    top:15px;
    font-size:2rem;
    cursor:pointer;
}

.modal-body{
    line-height:2;
    font-size:1.05rem;
}

.modal-body h2{
    color:var(--primary);
    margin-bottom:10px;
    text-align:center;
}

.modal-summary{
    background:rgba(255,140,0,.08);
    border-left:4px solid var(--primary);
    padding:15px 20px;
    border-radius:12px;
    margin:20px 0 30px;
    font-weight:600;
}

.modal-body p{
    margin-bottom:18px;
    text-align:justify;
}

.modal-body h3{
    margin-top:35px;
    margin-bottom:15px;
    color:var(--primary);
}

.modal-body ul{
    list-style:none;
    padding:0;
}

.modal-body li{
    position:relative;
    padding-left:28px;
    margin-bottom:12px;
    line-height:1.8;
}

.modal-body li::before{
    content:"✓";
    position:absolute;
    left:0;
    color:var(--primary);
    font-weight:bold;
}

.modal-conclusion{
    margin-top:30px;
    padding:20px;
    border-radius:12px;
    background:rgba(255,140,0,.08);
    border:1px solid rgba(255,140,0,.2);
}
.panch-card{
    cursor:pointer;
}

.current-modal{
    scrollbar-width: thin;
    scroll-behavior:smooth;
}
.panch-card:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}
@media(max-width:768px){

    .page-header h1{
        font-size:2.2rem;
    }

    .vande h1{
        font-size:2.8rem;
    }

}

</style>

</head>

<body>

    </button>

    <div class="logo">

        <div class="logo-text">

    <nav class="nav-links" id="navLinks">

<div class="panch-container">

        </h1>

        <p>
            व्यक्ति और समाज के पाँच आवश्यक परिवर्तन

<div id="introSection" class="intro-box"></div>

     class="importance-box">
</div>

        "footer-container"

    if(typeof updateLanguage === "function"){
        updateLanguage();

<div id="footer-container"></div>


<script>

/* Mobile Menu */

document.getElementById("menuBtn")
.addEventListener("click",()=>{

    document.getElementById("navLinks")
    .classList.toggle("show");

});


/* Theme */

if(localStorage.getItem("theme")==="dark"){

    document.body.classList.add("dark");

}

document.getElementById("themeBtn")
.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );

});

</script>
<script>

let panchData = [];

async function loadPanch(){

    const res = await fetch(
        "articles/panch-parivartan.json"
    );

    const data = await res.json();

    // INTRO

    document.getElementById(
        "introSection"
    ).innerHTML = `
    
        <div class="importance-box">

            <h2>
                ${data.subtitle}
            </h2>

            ${data.introduction
                .map(p=>`<p>${p}</p>`)
                .join("")
            }

        </div>

    `;


    // CONCLUSION

    const conclusion =
    data.sections.find(
        s => s.id === 6
    );

    document.getElementById(
        "conclusionBox"
    ).innerHTML = `

        <h2>
            ${conclusion.title}
        </h2>

        ${conclusion.content
            .map(p=>`<p>${p}</p>`)
            .join("")
        }

    `;


    // CARDS ONLY 1-5
    panchData = data.sections.filter(
        s => s.id !== 6
        );    
    renderCards();
}

function renderCards(){

    const grid =
    document.getElementById("panchGrid");

    grid.innerHTML = "";

    panchData.forEach(section=>{

        if(section.id === 0) return;

        grid.innerHTML += `

<div
    class="panch-card"
    onclick="openSection(${section.id})">

    <div class="panch-top">

        <div class="panch-number">
            ${section.id}
        </div>

        <div class="panch-title">
            ${section.title}
        </div>

    </div>

    <p>
        ${section.summary}
    </p>

</div>

`;

    });

}

function openSection(id){

    const section =
    panchData.find(
        s => s.id === id
    );

    if(!section) return;

    let html = `

        <h2>
            ${section.title}
        </h2>

    `;

    if(section.summary){

        html += `
        <div class="modal-summary">
            ${section.summary}
        </div>
        `;
    }

    if(section.content){

        section.content.forEach(p=>{

            html += `
            <p>${p}</p>
            `;

        });

    }

    if(section.youth_can_do){

        html += `
        <h3>
            युवा क्या कर सकते हैं?
        </h3>

        <ul>
        `;

        section.youth_can_do.forEach(item=>{

            html += `
            <li>${item}</li>
            `;

        });

        html += `
        </ul>
        `;
    }

    if(section.conclusion){

        html += `
        <div class="modal-conclusion">
        
            <h3>निष्कर्ष</h3>
        
            <p>
                ${section.conclusion}
            </p>
        
        </div>
        `;
    }

    document
    .getElementById("modalBody")
    .innerHTML = html;

    document
    .getElementById("panchModal")
    .classList.add("show");

}

document
.getElementById("closeModal")
.addEventListener("click",()=>{

    document
    .getElementById("panchModal")
    .classList.remove("show");

});

window.addEventListener("click",(e)=>{

    if(e.target.id==="panchModal"){

        document
        .getElementById("panchModal")
        .classList.remove("show");

    }

});

loadPanch();
</script>
<button id="floatingLangBtn" class="floating-lang-btn">
    EN
</button>

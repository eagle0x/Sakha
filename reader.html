<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>शाखा पुस्तिका</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

fetch(file)
.then(r => r.json())
.then(data => {

let html = `
<h1>${data.title}</h1>
<p>${data.subtitle || ""}</p>
`;

if(data.items){

data.items.forEach(item=>{

html += `
<div class="card">
<h2>${item.title}</h2>
<p>${item.description || ""}</p>
<p>${item.quote || ""}</p>
<p>${item.content || ""}</p>
<pre>${item.lyrics || ""}</pre>
</div>
`;

});

}

document.getElementById("content").innerHTML = html;

});
</script>

</body>
</html>
